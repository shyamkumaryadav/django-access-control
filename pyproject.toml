[project]
name = "backend"
version = "0.1.0"
description = "Production-ready RBAC system for Django-DRF"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "Shyamkumar Yadav", email = "shyamkumaryadav2003@gmail.com" }
]
dependencies = [
    "django>=5.1",
    "django-debug-toolbar>=8.0.0",
    "djangorestframework>=3.15",
    "python-decouple>=3.8",
]

[dependency-groups]
dev = [
    "black>=26.10.1",
    "django-stubs>=6.1.2",
    "flake8>=7.5.0",
    "flake8-pyproject",
    "isort>=9.0.2",
    "mypy>=2.4.1",
    "pytest>=8.0",
    "pytest-django>=4.7",
    "pytest-cov>=5.0",
]

[tool.black]
extend-exclude = '''
# A regex preceded with ^/ will apply only to files and directories
# in the root of the project.
(

  | .*_pb2\.py  # exclude autogenerated Protocol Buffer files anywhere in the project
)
'''
force-exclude = '''
(
  ^/.venv/
)
'''
[tool.flake8]
max-line-length = 88
extend-exclude = [".venv", "venv"]
extend-ignore = ["E203", "W503"]

[tool.isort]
profile = "black"
known_first_party = ["apps", "config"]
extend_skip = ["migrations", ".venv", "venv"]
filter_files = true
[tool.mypy]
plugins = ["mypy_django_plugin.main"]
strict = true
ignore_missing_imports = true
exclude = ['(^|/)(migrations|\.venv|venv)(/|$)']
exclude_gitignore = true
[tool.django-stubs]
django_settings_module = "config.settings.test"
[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
python_files = ["test_*.py", "*_tests.py"]

[tool.pyright]
include = ["."]
exclude = [
    "**/.venv",
    "**/venv",
    "**/__pycache__",
    "**/.mypy_cache",
    "**/.pytest_cache",
    "**/migrations",
    "**/dist",
    "**/build",
    "**/node_modules",
    "**/.git",
    "**/.*",
]
venvPath = "."
venv = ".venv"
typeCheckingMode = "basic"
extraPaths = ["."]

[[tool.pyright.executionEnvironments]]
root = "."
