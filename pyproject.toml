[project]
name = "rbac-code"
version = "0.1.0"
description = "Production-ready RBAC system for Django-DRF"
readme = "README.md"
requires-python = "==3.13.15"
authors = [
    { name = "Shyamkumar Yadav", email = "shyamkumaryadav2003@gmail.com" }
]
dependencies = [
    "django>=5.1",
    "djangorestframework>=3.15",
    "python-decouple>=3.8",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-django>=4.7",
    "pytest-cov>=5.0",
    "black>=24.0",
    "flake8>=7.0",
    "ruff>=0.6",
    "mypy>=1.0",
]
[tool.black]
line-length = 88
target-version = ["py313"]
extend-exclude = '''
# A regex preceded with ^/ will apply only to files and directories
# in the root of the project.
(

  | .*_pb2\.py  # exclude autogenerated Protocol Buffer files anywhere in the project
)
'''
force-exclude = '''
(
  ^/.venv/
)
'''
[tool.isort]
profile = "black"
line_length = 88
known_first_party = ["apps", "config"]
extend_skip = ["migrations", ".venv", "venv"]
filter_files = true
[tool.mypy]
plugins = ["mypy_django_plugin.main"]
python_version = "3.13"
strict = true
ignore_missing_imports = true
exclude = ['(^|/)(migrations|\.venv|venv)(/|$)']
exclude_gitignore = true
[tool.django-stubs]
django_settings_module = "config.settings.test"
[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings.test"
python_files = ["test_*.py", "*_tests.py"]
addopts = "--cov=apps --cov-report=term-missing"

[tool.pyright]
include = ["."]
exclude = [
    "**/.venv",
    "**/venv",
    "**/__pycache__",
    "**/.mypy_cache",
    "**/.pytest_cache",
    "**/migrations",
    "**/dist",
    "**/build",
    "**/node_modules",
    "**/.git",
    "**/.*",
]
venvPath = "."
venv = ".venv"
pythonVersion = "3.13"
typeCheckingMode = "basic"
extraPaths = ["."]

[[tool.pyright.executionEnvironments]]
root = "."

[dependency-groups]
dev = [
    "black>=26.10.1",
    "django-stubs>=6.1.2",
    "flake8>=7.5.0",
    "isort>=9.0.2",
    "mypy>=2.4.1",
]

[tool.ruff]
line-length = 88
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
